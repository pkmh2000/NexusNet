<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Indigo-Navy Deep Space Gradient (Full bleed, NO transparency) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Radial Nebula Glow behind Core Hub -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Sunburst Core Gradient for "我" (Central Nexus) -->
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Node Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background rectangle: NO transparency so iOS/Android never fill with black -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Nebula Radial Center Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#nebulaGlow)" />

  <!-- Concentric Orbital Guide Rings (1度、2度親疏人脈圈) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 10" opacity="0.35" />
  <circle cx="256" cy="256" r="118" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.45" />

  <!-- Golden Core Halo Aura -->
  <circle cx="256" cy="256" r="95" fill="url(#goldGlow)" />

  <!-- Inter-member Lateral Links (交織人脈網絡) -->
  <line x1="145" y1="150" x2="368" y2="145" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.5" />
  <line x1="135" y1="365" x2="256" y2="435" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.5" />
  <line x1="378" y1="360" x2="256" y2="435" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Luminous Interpersonal Connection Links to Central "我" -->
  <line x1="256" y1="256" x2="145" y2="150" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.95" />
  <line x1="256" y1="256" x2="368" y2="145" stroke="#c084fc" stroke-width="7" stroke-linecap="round" opacity="0.95" />
  <line x1="256" y1="256" x2="378" y2="360" stroke="#34d399" stroke-width="7" stroke-linecap="round" opacity="0.95" />
  <line x1="256" y1="256" x2="135" y2="365" stroke="#f472b6" stroke-width="7" stroke-linecap="round" opacity="0.95" />
  <line x1="256" y1="256" x2="256" y2="435" stroke="#fbbf24" stroke-width="6.5" stroke-linecap="round" opacity="0.95" />

  <!-- Satellite Member Nodes with high contrast & vivid glowing cores -->
  <!-- Node 1: Friends (Cyan #38bdf8) -->
  <circle cx="145" cy="150" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="5.5" filter="url(#nodeGlow)" />
  <circle cx="145" cy="150" r="22" fill="#38bdf8" />
  <circle cx="145" cy="150" r="10" fill="#ffffff" opacity="0.8" />

  <!-- Node 2: Mentors / Partners (Purple #c084fc) -->
  <circle cx="368" cy="145" r="40" fill="#0f172a" stroke="#c084fc" stroke-width="5.5" filter="url(#nodeGlow)" />
  <circle cx="368" cy="145" r="24" fill="#a855f7" />
  <circle cx="368" cy="145" r="11" fill="#ffffff" opacity="0.8" />

  <!-- Node 3: Colleagues / Business (Emerald #34d399) -->
  <circle cx="378" cy="360" r="36" fill="#0f172a" stroke="#34d399" stroke-width="5.5" filter="url(#nodeGlow)" />
  <circle cx="378" cy="360" r="20" fill="#10b981" />
  <circle cx="378" cy="360" r="9" fill="#ffffff" opacity="0.8" />

  <!-- Node 4: Family (Pink #f472b6) -->
  <circle cx="135" cy="365" r="38" fill="#0f172a" stroke="#f472b6" stroke-width="5.5" filter="url(#nodeGlow)" />
  <circle cx="135" cy="365" r="22" fill="#ec4899" />
  <circle cx="135" cy="365" r="10" fill="#ffffff" opacity="0.8" />

  <!-- Node 5: Community (Amber #fbbf24) -->
  <circle cx="256" cy="435" r="32" fill="#0f172a" stroke="#fbbf24" stroke-width="5" filter="url(#nodeGlow)" />
  <circle cx="256" cy="435" r="17" fill="#f59e0b" />
  <circle cx="256" cy="435" r="8" fill="#ffffff" opacity="0.8" />

  <!-- Central "我" Nexus Core Node (Sunburst Golden Orb with Star) -->
  <circle cx="256" cy="256" r="66" fill="url(#goldCore)" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="54" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="256" r="42" fill="url(#goldCore)" />

  <!-- Center Star Symbol -->
  <polygon points="256,232 264,248 282,251 269,263 273,281 256,271 239,281 243,263 230,251 248,248" fill="#ffffff" />
</svg>
