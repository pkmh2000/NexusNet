<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle Web Grid Lines -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />

  <!-- Connection Edges -->
  <line x1="256" y1="256" x2="150" y2="140" stroke="#60a5fa" stroke-width="4" opacity="0.8" />
  <line x1="256" y1="256" x2="370" y2="160" stroke="#a78bfa" stroke-width="4" opacity="0.8" />
  <line x1="256" y1="256" x2="380" y2="360" stroke="#34d399" stroke-width="4" opacity="0.8" />
  <line x1="256" y1="256" x2="160" y2="370" stroke="#f472b6" stroke-width="4" opacity="0.8" />
  <line x1="150" y1="140" x2="370" y2="160" stroke="#475569" stroke-width="2" opacity="0.6" />
  <line x1="160" y1="370" x2="380" y2="360" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Outer Satellite Nodes -->
  <circle cx="150" cy="140" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="4" filter="url(#glow)" />
  <circle cx="370" cy="160" r="32" fill="#1e293b" stroke="#a78bfa" stroke-width="4" filter="url(#glow)" />
  <circle cx="380" cy="360" r="26" fill="#1e293b" stroke="#34d399" stroke-width="4" filter="url(#glow)" />
  <circle cx="160" cy="370" r="30" fill="#1e293b" stroke="#f472b6" stroke-width="4" filter="url(#glow)" />

  <!-- Central Core Node ("Me") -->
  <circle cx="256" cy="256" r="54" fill="url(#goldGlow)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="42" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="256" r="20" fill="#d97706" />
</svg>
