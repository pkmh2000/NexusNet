<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Space Indigo Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Golden Core Gradient for "我" (Central Nexus) -->
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle with subtle rim -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Concentric Orbital Guide Rings (1度、2度親疏人脈圈) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2.5" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="rgba(99, 102, 241, 0.18)" stroke-width="2.5" stroke-dasharray="6 6" />

  <!-- Luminous Interpersonal Connection Links -->
  <!-- Direct Links to Center ("我") -->
  <line x1="256" y1="256" x2="140" y2="150" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <line x1="256" y1="256" x2="375" y2="145" stroke="#a855f7" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <line x1="256" y1="256" x2="390" y2="355" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <line x1="256" y1="256" x2="135" y2="365" stroke="#ec4899" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <line x1="256" y1="256" x2="256" y2="435" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />

  <!-- Inter-member Lateral Links (交織人脈網絡) -->
  <line x1="140" y1="150" x2="375" y2="145" stroke="rgba(148, 163, 184, 0.45)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />
  <line x1="135" y1="365" x2="256" y2="435" stroke="rgba(148, 163, 184, 0.45)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />
  <line x1="390" y1="355" x2="256" y2="435" stroke="rgba(148, 163, 184, 0.45)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />

  <!-- Satellite Member Nodes with vivid colors & avatar glyphs -->
  <!-- Node 1: Friends (Cyan #38bdf8) -->
  <circle cx="140" cy="150" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="4.5" filter="url(#nodeGlow)" />
  <circle cx="140" cy="150" r="18" fill="#38bdf8" opacity="0.9" />

  <!-- Node 2: Mentors / Partners (Purple #a855f7) -->
  <circle cx="375" cy="145" r="36" fill="#0f172a" stroke="#a855f7" stroke-width="4.5" filter="url(#nodeGlow)" />
  <circle cx="375" cy="145" r="20" fill="#a855f7" opacity="0.9" />

  <!-- Node 3: Colleagues / Business (Emerald #10b981) -->
  <circle cx="390" cy="355" r="32" fill="#0f172a" stroke="#10b981" stroke-width="4.5" filter="url(#nodeGlow)" />
  <circle cx="390" cy="355" r="17" fill="#10b981" opacity="0.9" />

  <!-- Node 4: Family (Pink #ec4899) -->
  <circle cx="135" cy="365" r="34" fill="#0f172a" stroke="#ec4899" stroke-width="4.5" filter="url(#nodeGlow)" />
  <circle cx="135" cy="365" r="18" fill="#ec4899" opacity="0.9" />

  <!-- Node 5: Community (Amber #f59e0b) -->
  <circle cx="256" cy="435" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="4" filter="url(#nodeGlow)" />
  <circle cx="256" cy="435" r="14" fill="#f59e0b" opacity="0.9" />

  <!-- Central "我" Nexus Core Node (Sunburst Golden Orb with Star) -->
  <circle cx="256" cy="256" r="62" fill="url(#goldCore)" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="50" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="256" r="38" fill="url(#goldCore)" />

  <!-- Center Star Symbol -->
  <polygon points="256,234 263,249 280,252 268,263 271,280 256,271 241,280 244,263 232,252 249,249" fill="#ffffff" />
</svg>
